plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace='com.example.vkperspective'
    compileSdk {
        version = release(36) {
            
        }

    ndkVersion="28.2.13676358"
    }    

    defaultConfig {
        applicationId "com.example.vkperspective"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version='3.22.1'
        }
    }
}

